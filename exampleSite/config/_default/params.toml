# Site Params

# Open Graph, Twitter Cards and schema.org Thing and Article (in posts)
# https://gohugo.io/templates/internal/#open-graph
# https://gohugo.io/templates/internal/#twitter-cards
# https://schema.org/Thing
# https://schema.org/Article
description = "Hugo theme for a secure, blazing fast and SEO-ready static website, using Bootstrap 5."
images = ['images/logo.svg','images/site-feature-image.png']
mainMenuLogo = "images/logo.svg"

# For favicons
## Chrome Browser
themeColor = "#fff"

# Alert
alert = false
alertDismissable = true
alertText = "Introducing this new service! <a class=\"alert-link stretched-link\" href=\"https://salvus.site/\">Check out Total Security</a>"

# Pre-footer
footerAbout = true
footerAboutTitle = "Few Words About Us"
footerAboutText = "We protect your website so you can provide a safe environment to build trust and improve the user experience of your visitors.<br/><br/>Salvus Site is the partner that you can rely on for preventive and reactive cybersecurity."

# ---------------------------------------------------------------------------
# Social identifiers used in <head> metadata. These are single values consumed by
# head/twitter.html and head/facebook-admin.html, and are unrelated to the [[social]]
# menu in config/_default/menus/, which is what renders the social links themselves.
#
# Older sites set these under [social] as a map (social.twitter, social.facebook_admin);
# that still works and is used when the params below are unset.
# ---------------------------------------------------------------------------

# twitterSite = "hugobootstrap"    # handle only, without the @, for twitter:site
# facebookAdmin = "1234567890"     # Facebook Page Admin ID, for fb:admins

[options]
  bootStrapJs = true
  breadCrumb = true
  listCategoryFilter = true
  listTagFilter = true

# ---------------------------------------------------------------------------
# Google tag (gtag.js) — drives layouts/partials/head/google-tag.html.
# Commented out here so the demo site measures nothing; uncomment and set your
# own IDs to enable it.
# ---------------------------------------------------------------------------
#
# By default the tag runs in Consent Mode with every consent type denied, so it
# sets no cookies, stores nothing on the visitor's device, and needs no consent
# banner. Reporting is correspondingly limited: event counts by country, device
# and channel, with no users, sessions or attribution.
#
# Setting cookies = true disables those defaults and lets the tag set cookies
# normally. The site is then responsible for presenting a consent banner that
# calls gtag('consent', 'update', ...). The theme emits a build warning saying
# so, which a site can acknowledge with:
#
#   ignoreLogs = ['google-tag-cookies-allowed']
#
# A site that sets params.contentSecurityPolicy also has to allow
# https://www.googletagmanager.com in script-src, or the browser blocks the tag.
#
#[googleTag]
#  measurementId = "G-XXXXXXXXXX"
#  googleAds = "AW-XXXXXXXXX"
#  cookies = false

# ---------------------------------------------------------------------------
# Structured data (JSON-LD) — https://schema.org
# Each block below drives one partial in layouts/partials/head/. Remove a block
# and its schema simply stops being emitted.
# ---------------------------------------------------------------------------

# schema.org/WebSite — rendered on the home page
[webSite]
  name = "Hugo Bootstrap Theme"
  description = "Hugo theme for a secure, blazing fast and SEO-ready static website, using Bootstrap 5."
  image = "images/site-feature-image.png"
  url = "https://filipecarneiro.github.io/hugo-bootstrap-theme/"
  [webSite.copyrightHolder]
    name = "Hugo Bootstrap Theme"

# schema.org/Organization — rendered on the home page
[organization]
  name = "Hugo Bootstrap Theme"
  legalName = "Hugo Bootstrap Theme"
  description = "Open source Hugo theme built on Bootstrap 5."
  logo = "images/site-feature-image.png"
  url = "https://filipecarneiro.github.io/hugo-bootstrap-theme/"
  [organization.address]
    streetAddress = "Rua de Exemplo 100"
    locality = "Porto"
    region = "Porto"
    postalCode = "4000-000"
    country = "PT"
  [organization.contactPoint]
    email = "example@example.com"
    telephone = "+351000000000"
    url = "https://filipecarneiro.github.io/hugo-bootstrap-theme/contact/"

# schema.org/LocalBusiness — rendered on the home page
# The identity here is the theme's own, but the address and map point at a real
# place: a static map demo is only honest if the picture, the coordinates and
# the link all agree on somewhere that exists.
[localBusiness]
  name = "Hugo Bootstrap Theme"
  image = "images/site-feature-image.png"
  telephone = "+351000000000"
  priceRange = "$$"
  webpage = "https://filipecarneiro.github.io/hugo-bootstrap-theme/"
  [localBusiness.address]
    streetAddress = "Rua da Misericórdia, 6"
    extendedAddress = "Sala 3"
    locality = "Vila do Conde"
    region = "Porto"
    postalCode = "4480-758"
    country = "PT"
    countryName = "Portugal"
  [localBusiness.map]
    latitude = "41.3534268"
    longitude = "-8.7434646"
    # Google Maps customer ID, not the Business Profile ID: see the static-map
    # shortcode for how to read it out of a Maps place URL.
    cid = "4551885198553855081"

# schema.org/Event — rendered on the home page
[event]
  name = "Hugo Bootstrap Theme Community Meetup"
  startDate = "2026-10-01T18:00:00+01:00"
  endDate = "2026-10-01T20:00:00+01:00"
  description = "An example event showing how Event structured data is emitted by this theme."
  attendanceMode = "OfflineEventAttendanceMode"
  status = "EventScheduled"
  PlaceName = "Example Venue"
  image = "images/site-feature-image.png"
  performers = ["Filipe Carneiro", "Theme Contributors"]
  [event.address]
    streetAddress = "Rua de Exemplo 100"
    locality = "Porto"
    postalCode = "4000-000"
    country = "PT"
  [event.offer]
    price = "0"
    priceCurrency = "EUR"
    availability = "InStock"
    description = "Free admission"
    validFrom = "2026-09-01T00:00:00+01:00"
    url = "https://filipecarneiro.github.io/hugo-bootstrap-theme/"
