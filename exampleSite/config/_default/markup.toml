defaultMarkdownHandler = "goldmark"

[goldmark]

  [goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true

  [goldmark.parser]
    autoHeadingID = true
    wrapStandAloneImageWithinParagraph = false

    [goldmark.parser.attribute]
      block = true
      title = true

  [goldmark.renderer]
    hardWraps = false
    unsafe = true
    xHTML = false

[highlight]
  # Hugo defaults to Monokai, whose comment/subheading grey (#75715e) sits at
  # 3.03:1 and whose keyword pink (#f92672) at 3.93:1 against the #272822 code
  # background - both under the 4.5:1 WCAG AA asks for, so Lighthouse fails the
  # page on colour contrast.
  #
  # modus-operandi is built for high contrast and clears AA on every token by
  # the widest margin of the styles measured, 8.01:1 at its worst. Its white
  # background suits a light page; the border and padding that make it read as
  # a code block rather than bare text come from .highlight in custom.scss.
  #
  # Light styles usually fail on comments - github (light) manages 2.32:1 and
  # friendly 2.18:1 - so re-measure before swapping this value.
  style = "modus-operandi"

[tableOfContents]
  endLevel = 3
  ordered = false
  startLevel = 2
