<!-- Article Schema.org Type -->
<!-- https://schema.org/Article -->
<!-- Output all taxonomies as schema.org keywords -->

<!-- Revision based on Google guide https://developers.google.com/search/docs/advanced/structured-data/article#non-amp -->
{{ $iso8601 := "2006-01-02T15:04:05-07:00" -}}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {{/* `articleType` in front matter picks a more specific subtype of Article -
       BlogPosting for a blog, NewsArticle for news. Set it once for a whole section
       with a cascade in the section's _index.md rather than per page. */}}
  "@type": "{{ .Params.articleType | default "Article" }}",
  "headline": "{{ .Title }}",
  {{/* The page's own language, so a translated article is not read as the site's
       default one. */}}
  "inLanguage": "{{ .Language.Locale | default .Site.Language.Lang }}",

  {{ $supportedImageTypes := slice "png" "jpeg" "webp" "gif" }}
  {{ $images := slice }}
  {{ range ($.Param "images") }}
    {{ with $.Resources.GetMatch . }}
      {{ if in $supportedImageTypes .MediaType.SubType }}
        {{ $images = $images | append .Permalink }}
      {{ end }}
    {{ end }}
  {{ end }}
  {{ if $images }}
  "image": {{ $images }},
  {{ end }}

  {{ if not .PublishDate.IsZero }}
  "datePublished": "{{ .PublishDate.Format $iso8601 }}",
  {{ end }}
  "dateModified": "{{ .Lastmod.Format $iso8601 }}",

  {{- if .Params.authors }}
  "author": [
    {{- range $i, $author := .Params.authors }}
      {{- if $i }},{{ end }}
      {
        "@type": "Person",
        "name": "{{ $author }}"
        {{- with $.Site.GetPage (printf "/authors/%s" $author) }}
        , "url": "{{ .Permalink }}"
        {{- end }}
      }
    {{- end }}
  ],
  {{- else }}
  {{- /* Google asks for an author on an Article. A company blog often has no named
         one, and the organization already configured is the truthful answer. */}}
  {{- with .Site.Params.organization }}
  "author": {
    "@type": "Organization",
    "name": "{{ .name }}"
    {{- with .url }}, "url": "{{ . }}"{{ end }}
  },
  {{- end }}
  {{- end }}

  "mainEntityOfPage": "{{ .Permalink }}",

  "publisher": {
    "@type": "Organization",
    "name": "{{ .Site.Title }}"
    {{ with $.Site.Params.images }}
      {{/* Fingerprinted, like every other image the theme publishes: an unhashed URL
           under a path served with a long immutable cache can never be replaced. */}}
      {{ with resources.GetMatch (index . 0) }}
      , "logo": {
        "@type": "ImageObject",
        "url": "{{ (. | fingerprint).Permalink }}"
      }
      {{ end }}
    {{ end }}
  },

  "wordcount": {{ .Content | countwords }},
  "description": "{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }}"

  {{- if .Keywords }},
  "keywords": {{ .Keywords }}
  {{- end }}
}
</script>
